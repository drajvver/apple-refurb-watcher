name: Build and Publish Docker Image

on:
  # Publishing a GitHub release creates its tag, so this also covers releases
  # (a separate `release` trigger would build and deploy everything twice).
  push:
    tags:
      - 'v*'
  # Preview images (pr-<number>, sha-<short>) for testing before a release. Never auto-deployed.
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Fork PRs get a read-only token and can't push to GHCR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to Bunny.net Magic Containers
    needs: build-and-push
    # Only releases roll out automatically; PR images are deployed by hand.
    # Skipped until the BUNNYNET_APP_ID variable and BUNNYNET_API_KEY secret are set.
    if: startsWith(github.ref, 'refs/tags/') && vars.BUNNYNET_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Update container image on Bunny.net Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNYNET_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: ${{ vars.BUNNYNET_CONTAINER_NAME || 'Container-1' }}
          image_tag: "${{ github.ref_name }}"
